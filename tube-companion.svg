<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d">
  <title id="t">Tube Companion MCP Server</title>
  <desc id="d">A snowy winter night over the London skyline, with Big Ben, the London Eye, St Paul's, the Shard and Tower Bridge.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#34558a"/>
    </linearGradient>
    <clipPath id="card"><rect width="800" height="300" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="Helvetica, Arial, sans-serif">
    <rect width="800" height="300" fill="url(#sky)"/>

    <!-- moon -->
    <circle cx="730" cy="52" r="20" fill="#f4f1e0"/>
    <circle cx="738" cy="47" r="18" fill="#12264a" opacity=".18"/>

    <!-- snowflakes -->
    <g fill="#fff">
      <circle cx="40" cy="40" r="2" opacity=".8"/><circle cx="150" cy="70" r="1.5" opacity=".7"/>
      <circle cx="210" cy="30" r="2.5" opacity=".9"/><circle cx="300" cy="75" r="1.5" opacity=".6"/>
      <circle cx="520" cy="38" r="2" opacity=".8"/><circle cx="590" cy="80" r="1.5" opacity=".7"/>
      <circle cx="650" cy="30" r="2.5" opacity=".9"/><circle cx="770" cy="95" r="2" opacity=".7"/>
      <circle cx="90" cy="150" r="1.5" opacity=".6"/><circle cx="470" cy="165" r="2" opacity=".7"/>
      <circle cx="540" cy="130" r="1.5" opacity=".6"/><circle cx="20" cy="110" r="2" opacity=".7"/>
      <circle cx="330" cy="150" r="1.5" opacity=".6"/><circle cx="700" cy="140" r="2" opacity=".7"/>
    </g>

    <!-- back skyline -->
    <g fill="#223c66">
      <rect x="190" y="195" width="40" height="50"/><rect x="395" y="185" width="30" height="60"/>
      <rect x="430" y="200" width="45" height="45"/><rect x="480" y="190" width="35" height="55"/>
      <rect x="515" y="205" width="40" height="40"/><rect x="665" y="200" width="25" height="45"/>
    </g>

    <!-- Big Ben + Parliament -->
    <g fill="#10213d">
      <rect x="70" y="122" width="36" height="120"/>
      <polygon points="70,122 88,84 106,122"/>
      <rect x="108" y="196" width="86" height="46"/>
      <rect x="150" y="178" width="12" height="20"/><polygon points="150,178 156,164 162,178"/>
    </g>
    <circle cx="88" cy="142" r="9" fill="#ffd98a"/>
    <g fill="#ffd98a" opacity=".85">
      <rect x="80" y="168" width="4" height="8"/><rect x="92" y="168" width="4" height="8"/>
      <rect x="80" y="190" width="4" height="8"/><rect x="92" y="190" width="4" height="8"/>
      <rect x="118" y="212" width="5" height="7"/><rect x="132" y="212" width="5" height="7"/>
      <rect x="146" y="212" width="5" height="7"/><rect x="166" y="212" width="5" height="7"/>
      <rect x="180" y="212" width="5" height="7"/>
    </g>

    <!-- London Eye -->
    <g transform="translate(0 14)">
    <g fill="none" stroke="#9cc0ee" stroke-width="2">
      <circle cx="268" cy="178" r="46"/><circle cx="268" cy="178" r="3" fill="#9cc0ee"/>
      <line x1="268" y1="132" x2="268" y2="224"/><line x1="222" y1="178" x2="314" y2="178"/>
      <line x1="235.5" y1="145.5" x2="300.5" y2="210.5"/><line x1="300.5" y1="145.5" x2="235.5" y2="210.5"/>
      <line x1="268" y1="178" x2="256" y2="242"/><line x1="268" y1="178" x2="280" y2="242"/>
    </g>
    <g fill="#ffd98a">
      <circle cx="268" cy="132" r="3"/><circle cx="314" cy="178" r="3"/><circle cx="222" cy="178" r="3"/>
      <circle cx="300.5" cy="145.5" r="3"/><circle cx="235.5" cy="145.5" r="3"/><circle cx="300.5" cy="210.5" r="3"/><circle cx="235.5" cy="210.5" r="3"/>
    </g>

    </g>

    <!-- St Paul's -->
    <g fill="#10213d">
      <rect x="338" y="208" width="52" height="34"/>
      <rect x="350" y="192" width="28" height="18"/>
      <path d="M350 192 A14 14 0 0 1 378 192 Z"/>
      <rect x="362" y="170" width="4" height="8"/><rect x="361" y="172" width="6" height="2"/>
      <rect x="341" y="196" width="8" height="14"/><rect x="379" y="196" width="8" height="14"/>
    </g>

    <!-- The Shard -->
    <polygon points="622,242 658,242 640,102" fill="#10213d"/>
    <polygon points="640,102 658,242 645,242" fill="#1a3358"/>

    <!-- Tower Bridge -->
    <g fill="#10213d">
      <rect x="700" y="168" width="20" height="74"/><polygon points="700,168 710,148 720,168"/>
      <rect x="752" y="168" width="20" height="74"/><polygon points="752,168 762,148 772,168"/>
      <rect x="720" y="182" width="32" height="5"/>
    </g>
    <path d="M720 214 Q736 238 752 214" fill="none" stroke="#10213d" stroke-width="4"/>
    <g fill="#ffd98a" opacity=".85"><rect x="708" y="190" width="4" height="8"/><rect x="760" y="190" width="4" height="8"/></g>

    <!-- snowy ground -->
    <path d="M0 240 Q100 230 200 240 T400 240 T600 240 T800 238 V300 H0 Z" fill="#eaf2fb"/>
    <path d="M0 262 Q150 254 300 262 T600 262 T800 260 V300 H0 Z" fill="#d6e4f4"/>

    <!-- roundel + text -->
    <circle cx="400" cy="46" r="17" fill="none" stroke="#e32017" stroke-width="5"/>
    <rect x="375" y="41" width="50" height="10" rx="1" fill="#0019a8"/>
    <text x="400" y="112" text-anchor="middle" font-size="40" font-weight="700" fill="#fff" letter-spacing="1">Tube Companion MCP Server</text>
    <text x="400" y="138" text-anchor="middle" font-size="17" fill="#c9daf2">Your winter guide to London</text>
  </g>
</svg>
